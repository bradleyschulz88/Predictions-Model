name: Publish GitHub Pages dashboard

on:
  push:
    branches: [main]
  schedule:
    # Deliberately off the hour and half-hour. "*/30 * * * *" fires at :00 and
    # :30, the two most congested minutes on GitHub's scheduler, and scheduled
    # runs get dropped under load rather than queued. Measured over 2026-08-04
    # the board updated every 75-195 minutes against a nominal 30, averaging
    # about 90. Same cadence requested, just at minutes nobody else wants.
    #
    # Re-measured 2026-08-05, after that change: gaps of 83, 99, 109, 109, 123,
    # 136, 170, 194 and 266 minutes. Averaging about two hours, so moving off
    # the busy minutes bought nothing measurable. No runs were cancelled and
    # none failed -- the scheduler simply does not create them. That is
    # documented best-effort behaviour for `schedule`, not a misconfiguration
    # here, and there is no cron expression that fixes it.
    #
    # So do not tune this again expecting a different result. The board now
    # reports the age of its last build rather than promising a cadence
    # (buildAgeNote in dashboard/app.js). Getting a real 30 minutes needs an
    # external trigger calling workflow_dispatch, which is infrastructure this
    # project does not have.
    - cron: "7,37 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let a deployment finish. Cancelling one mid-flight aborted a publish that
  # was already partway through, and every cancelled run was recorded as a
  # failed deployment -- so the deployments page filled with red crosses that
  # looked like breakages but were just a newer run arriving.
  #
  # This does not let runs pile up: GitHub keeps at most one pending run per
  # concurrency group, cancelling the previously-pending one when a newer run
  # queues behind it. So the worst case is one running plus one waiting, and
  # the newest commit still wins. At ~6 minutes a run against a 30-minute
  # schedule there is no queueing pressure anyway.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      # Whichever attempt got there. Each earlier one is empty when it failed.
      url: ${{ steps.deployment.outputs.page_url || steps.deployment_retry.outputs.page_url || steps.deployment_last.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install certifi

      - name: Configure TLS for Python requests
        run: echo "SSL_CERT_FILE=$(python -c 'import certifi; print(certifi.where())')" >> "$GITHUB_ENV"

      - name: Prepare docs site
        run: |
          mkdir -p docs/data
          # Copy every shipped asset rather than an enumerated list that a new
          # file can be left out of. tests/test_dashboard_assets.py asserts the
          # two stay in step.
          cp dashboard/index.html dashboard/tools.html docs/
          cp dashboard/board.css dashboard/board.js docs/
          cp dashboard/app.js dashboard/styles.css docs/
          cp dashboard/manifest.json dashboard/sw.js docs/
          # The service worker evicts a previous build by cache name, so the
          # name has to change whenever a shipped asset does. Deriving it from
          # the files themselves removes the manual bump that had already been
          # missed for 23 commits -- see scripts/stamp_service_worker.py.
          python scripts/stamp_service_worker.py docs

      # tests/test_dashboard_render.py drives headless Chromium to check real
      # geometry -- column clipping, alignment, horizontal overflow -- which
      # string assertions against board.js structurally cannot do. The runner
      # image ships Google Chrome, so nothing is installed here; this step
      # just names the browser it will use, so a runner that ever loses one
      # produces an obvious message rather than a puzzling test failure.
      - name: Locate a browser for the render tests
        run: |
          for candidate in google-chrome chromium chromium-browser chrome; do
            if command -v "$candidate" >/dev/null 2>&1; then
              echo "render tests will use: $(command -v "$candidate")"
              exit 0
            fi
          done
          echo "::error::No Chromium-family browser on PATH. The dashboard render \
          tests need one; install chromium or unset REQUIRE_RENDER_TESTS below."
          exit 1

      - name: Run tests
        env:
          # Turn "no browser, so skip" into a failure. A silent skip here would
          # mean layout regressions had quietly stopped failing the build.
          REQUIRE_RENDER_TESTS: "1"
        run: python -m unittest discover -s tests -q

      # Refit before building so the slate is predicted with the newest weights.
      # Fitting only ever reads already-graded games, so this cannot leak.
      - name: Refit model and gate on quality
        run: |
          python model_fit.py
          # The weights are no longer committed, so a silent failure here would
          # publish heuristic-fallback picks that look identical in the output.
          # Fail the build instead.
          test -s docs/data/model_weights.json \
            || { echo "::error::model_fit.py produced no weights"; exit 1; }
          python scripts/backtest_model.py --evaluate --write
          python scripts/check_regression.py

      # Informational only: whether a queued candidate (h2h, handedness,
      # bullpen, elo, ...) now beats the shipped feature set as more games
      # grade. This used to mean someone remembering to run --ablate by hand;
      # now it reruns every build and the dashboard reads the result.
      - name: Recheck queued candidate features
        run: python model_fit.py --ablate --write

      # ESPN core side-market prices, carried between builds. The pass that
      # prices MLB runlines fires one request per unpriced game and the build
      # runs every thirty minutes; the hour-long TTL in espn_odds only bites if
      # the cache outlives the interpreter, which on CI it otherwise does not.
      # restore-keys means a miss falls back to the most recent build's file
      # rather than starting cold, and the run_id in the key makes every build
      # write a fresh entry instead of racing the same one.
      # The Odds API file in here is the one that costs money: without it that
      # provider's six-hour cache never survives the interpreter, and MLB alone
      # would spend a credit on each of ~48 builds a day against an allowance
      # of 500 a month.
      - name: Restore side-market price cache
        uses: actions/cache@v4
        with:
          path: |
            .cache/side-market-odds.json
            .cache/odds-api.json
          key: side-market-odds-${{ github.run_id }}
          restore-keys: |
            side-market-odds-

      - name: Build dashboard JSON
        env:
          ESPN_SIDE_MARKET_CACHE: .cache/side-market-odds.json
          ODDS_API_CACHE: .cache/odds-api.json
          # NVIDIA_API_KEY used to be passed here for the injury-importance
          # scorer. That scorer is gone: injuryDiff and injurySeverityDiff both
          # made walk-forward log loss worse at every sample size measured, so
          # a metered external dependency was being carried to feed a feature
          # the data kept declining. The deterministic score remains and needs
          # no key. The secret can be deleted from the repository settings.
          #
          # The only price source that covers AFL -- it has
          # no SportsBookReview board and nothing in ESPN core, so without this
          # every AFL pick stays unpriced and cannot be valued or ranked.
          # Free plan at the-odds-api.com is 500 credits a month; the provider
          # caches for six hours and only calls when AFL games are actually
          # unpriced, which lands near 200. Absent, nothing is called at all.
          ODDS_API_KEY: ${{ secrets.ODDS_API_KEY }}
        run: python scripts/build_pages_data.py

      # Re-score after grading so the published evaluation reflects today's
      # results rather than yesterday's.
      - name: Refresh evaluation report
        run: python scripts/backtest_model.py --evaluate --write

      - name: Commit model and accuracy data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only state that cannot be recomputed. model_weights, evaluation and
          # calibration are rebuilt from these three every run, so committing
          # them just created merge conflicts on generated output. They still
          # reach the site: the Pages artifact uploads docs/ from disk.
          git add docs/data/accuracy.json \
                  docs/data/predictions_log.json \
                  docs/data/model_baseline.json || true
          git diff --staged --quiet && exit 0
          git commit -m "Update prediction accuracy [skip ci]"
          # Still needed now that runs queue instead of cancelling: this job
          # pushes to the same branch its own commit triggers builds from, and
          # a scheduled run or a merged pull request can land between this
          # checkout and this push. Rebase and retry rather than dropping the
          # run's data.
          #
          # The abort is what makes the retries worth anything. `git pull
          # --rebase` stops on a conflict and leaves unmerged files behind, and
          # every later attempt then dies on "Pulling is not possible because
          # you have unmerged files" without ever trying again -- so all four
          # attempts were spent on the first failure. Seen on the 14:21Z run of
          # 2026-08-05, which gave up and warned while a pull request merged
          # mid-build had moved main underneath it.
          #
          # Conflicts here are always on regenerated data, and this run's copy
          # is the newer computation over the same inputs, so it wins. In a
          # rebase "theirs" is the commit being replayed -- ours -- which is
          # the opposite of what the word suggests everywhere else.
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** attempt))
            git rebase --abort 2>/dev/null || true
            git fetch origin main || true
            git rebase -X theirs origin/main || git rebase --abort 2>/dev/null || true
          done
          # Loud rather than soft. This used to be a ::warning::, which renders
          # the same shade as "everything is fine" next to a green tick, and a
          # build that quietly failed to record its picks is exactly the kind
          # of thing that goes unnoticed for a week. Deliberately does not fail
          # the step: the deploy below publishes from disk and matters more,
          # and the next build regenerates the log from the same sources.
          echo "::error::Could not push updated model data after 4 attempts;"\
               "this run's accuracy data is not recorded. The board still"\
               "deployed. The next build should recover it."

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      # The action's timeout is 600000ms and that is also its ceiling. On
      # 2026-08-06 it became the difference between a green build and a red one
      # rather than a real signal -- GitHub's Pages deployments slowed from ~6
      # seconds the day before to the best part of ten minutes:
      #
      #   14:58Z run  deploy took 9m39s  -> succeeded with 21 seconds to spare
      #   12:28Z run  deploy took 10m02s -> "Timeout reached, aborting!"
      #
      # Everything before the deploy succeeded in both: tests, refit, build,
      # and the data commit. The only difference between them was which side of
      # ten minutes a queue happened to land on, and losing that coin flip
      # cancelled a deployment that was otherwise on its way.
      #
      # Raising the timeout was the obvious fix and it does not work. `timeout:
      # 1200000` shipped, and every run since has logged
      #
      #   Warning: timeout value is greater than the allowed maximum -
      #   timeout set to the maximum of 600000 milliseconds
      #
      # so the value was clamped straight back to ten minutes. The stated
      # twenty minutes of headroom never existed. Do not raise this again; the
      # action will not honour it. tests/test_deploy_timeout.py pins that.
      #
      # A second attempt is what is actually available. On timeout the action
      # cancels the deployment it was waiting on, so the retry starts clean
      # rather than racing a live one, and it buys the same ten minutes over
      # again against a queue that has had ten minutes to drain. `timeout-minutes:
      # 45` on the job leaves room for all three attempts below.
      #
      # The retry originally followed the first attempt with no delay, which
      # made it useless against the failure that actually turned up. That
      # reasoning above only holds for a TIMEOUT, where ten minutes have
      # already elapsed before the retry starts. A Pages API outage does not
      # time out -- it answers immediately:
      #
      #   17:44:42.15  Failed to create deployment (status: 503)
      #   17:44:43.90  Failed to create deployment (status: 503)
      #
      # 1.75 seconds apart, against an outage that lasted over two hours (runs
      # 1058, 1059 and 1061 on 2026-08-17). Two attempts inside two seconds is
      # one attempt with extra logging.
      #
      # So the wait is now explicit and escalating. It costs nothing on the
      # normal path -- these steps only run after a failure -- and it is the
      # difference between riding out a blip and reporting it as a broken
      # build. Worst case is 6 min of build + 10 + 1 + 10 + 2 + 10 = 39 min,
      # inside the job's 45.
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
        # So a failed first attempt reaches the retries below instead of
        # ending the job here.
        continue-on-error: true
        with:
          timeout: 600000

      - name: Wait before the first retry
        if: steps.deployment.outcome == 'failure'
        run: sleep 60

      - name: Retry the Pages deployment
        id: deployment_retry
        if: steps.deployment.outcome == 'failure'
        uses: actions/deploy-pages@v5
        continue-on-error: true
        with:
          timeout: 600000

      - name: Wait before the last retry
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        run: sleep 120

      # No continue-on-error: if a deployment cannot land in three attempts
      # across three minutes of backoff, that is the case worth seeing red.
      - name: Last retry of the Pages deployment
        id: deployment_last
        if: steps.deployment.outcome == 'failure' && steps.deployment_retry.outcome == 'failure'
        uses: actions/deploy-pages@v5
        with:
          timeout: 600000
