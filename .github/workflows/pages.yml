name: Publish GitHub Pages dashboard

on:
  push:
    branches: [main]
  schedule:
    - cron: "*/30 * * * *"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: pages
  # Let a deployment finish. Cancelling one mid-flight aborted a publish that
  # was already partway through, and every cancelled run was recorded as a
  # failed deployment -- so the deployments page filled with red crosses that
  # looked like breakages but were just a newer run arriving.
  #
  # This does not let runs pile up: GitHub keeps at most one pending run per
  # concurrency group, cancelling the previously-pending one when a newer run
  # queues behind it. So the worst case is one running plus one waiting, and
  # the newest commit still wins. At ~6 minutes a run against a 30-minute
  # schedule there is no queueing pressure anyway.
  cancel-in-progress: false

jobs:
  build-and-deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"

      - name: Install build dependencies
        run: pip install certifi

      - name: Configure TLS for Python requests
        run: echo "SSL_CERT_FILE=$(python -c 'import certifi; print(certifi.where())')" >> "$GITHUB_ENV"

      - name: Prepare docs site
        run: |
          mkdir -p docs/data
          # Copy every shipped asset rather than an enumerated list that a new
          # file can be left out of. tests/test_dashboard_assets.py asserts the
          # two stay in step.
          cp dashboard/index.html dashboard/tools.html docs/
          cp dashboard/board.css dashboard/board.js docs/
          cp dashboard/app.js dashboard/styles.css docs/
          cp dashboard/manifest.json dashboard/sw.js docs/

      - name: Run tests
        run: python -m unittest discover -s tests -q

      # Refit before building so the slate is predicted with the newest weights.
      # Fitting only ever reads already-graded games, so this cannot leak.
      - name: Refit model and gate on quality
        run: |
          python model_fit.py
          # The weights are no longer committed, so a silent failure here would
          # publish heuristic-fallback picks that look identical in the output.
          # Fail the build instead.
          test -s docs/data/model_weights.json \
            || { echo "::error::model_fit.py produced no weights"; exit 1; }
          python scripts/backtest_model.py --evaluate --write
          python scripts/check_regression.py

      # Informational only: whether a queued candidate (h2h, handedness,
      # bullpen, elo, ...) now beats the shipped feature set as more games
      # grade. This used to mean someone remembering to run --ablate by hand;
      # now it reruns every build and the dashboard reads the result.
      - name: Recheck queued candidate features
        run: python model_fit.py --ablate --write

      - name: Build dashboard JSON
        env:
          # Optional. When the secret is absent this is empty, injury severity
          # falls back to its deterministic score, and the build is unaffected.
          # Add it at Settings > Secrets and variables > Actions.
          NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
        run: python scripts/build_pages_data.py

      # Re-score after grading so the published evaluation reflects today's
      # results rather than yesterday's.
      - name: Refresh evaluation report
        run: python scripts/backtest_model.py --evaluate --write

      - name: Commit model and accuracy data
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          # Only state that cannot be recomputed. model_weights, evaluation and
          # calibration are rebuilt from these three every run, so committing
          # them just created merge conflicts on generated output. They still
          # reach the site: the Pages artifact uploads docs/ from disk.
          git add docs/data/accuracy.json \
                  docs/data/predictions_log.json \
                  docs/data/model_baseline.json || true
          git diff --staged --quiet && exit 0
          git commit -m "Update prediction accuracy [skip ci]"
          # Still needed now that runs queue instead of cancelling: this job
          # pushes to the same branch its own commit triggers builds from, and
          # a scheduled run can land between this checkout and this push.
          # Rebase and retry rather than dropping the run's data.
          for attempt in 1 2 3 4; do
            if git push; then exit 0; fi
            sleep $((2 ** attempt))
            git pull --rebase origin main || true
          done
          echo "::warning::Could not push updated model data after 4 attempts"

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v4
        with:
          path: docs

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
