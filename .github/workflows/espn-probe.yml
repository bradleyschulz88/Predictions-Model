name: ESPN reachability probe

# Temporary diagnostic. The scheduled build started getting HTTP 403 on every
# ESPN scoreboard request some time between 2026-08-04 11:05Z and 23:31Z. This
# probe runs from a GitHub runner (the network that matters) and reports which
# header profiles and hosts ESPN accepts, so the fix is chosen from evidence
# rather than guessed at. Delete once the cause is known.

on:
  workflow_dispatch:
  push:
    branches:
      - "claude/**"
    paths:
      - ".github/workflows/espn-probe.yml"
      - "scripts/probe_espn.py"

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Probe ESPN
        run: python scripts/probe_espn.py

      # NBA and NFL are the only MARGIN_STD_DEV entries not measured from
      # played games. Both seasons are already in ESPN's archive, so measure
      # them here rather than keep the published-figure exception.
      - name: Measure NBA and NFL final-margin SD
        run: |
          python scripts/measure_margin_sd.py nba 2025-11-01 2026-03-31
          python scripts/measure_margin_sd.py nfl 2025-09-04 2026-01-05
          python scripts/measure_margin_sd.py wnba 2025-05-16 2025-09-11
